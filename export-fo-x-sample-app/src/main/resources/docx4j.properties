# docx4j looks for this file on the classpath and logs a warning when it is missing.
# The defaults suit DOCX -> PDF; these are the entries worth knowing about.
# Property names verified against docx4j-core 11.5.9.

# Zip-bomb guards. Raise these only as far as your largest legitimate template needs;
# the defaults are 50 MB per part, 50 MB uncompressed in total, and a ratio of 500.
docx4j.openpackaging.parts.MAX_BYTES.unzip.error=52428800
docx4j.openpackaging.package.MAX_UNCOMPRESSED_SIZE.unzip.error=104857600
docx4j.openpackaging.parts.MAX_RATIO.unzip.error=500

# Scan the machine's installed fonts. Leave this on: a font docx4j cannot find is
# substituted, and because line breaking follows the substitute's metrics the whole
# document reflows. Fonts that are not installed system-wide can be added with
# export-fo-x.font-directories in application.yml.
docx4j.fonts.discoverPhysicalFonts.enabled=true
